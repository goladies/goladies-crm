<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Painel da motorista · Go Ladies</title>
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <meta name="theme-color" content="#FF2D9C">

  <!-- O painel da motorista mora em motora.goladies.com.br, no
       repositório do site. Esta cópia aqui no CRM parou em 21/08/2026, antes
       do código de início e da conclusão por função: concluir viagem por ela
       fechava o status sem criar o repasse em pagamentos_motorista, ou seja,
       o pagamento da motorista sumia em silêncio.

       Em vez de apagar o arquivo (o que deixaria um 404 pra quem salvou o
       atalho no celular entre 18 e 21/08), ele virou este redirecionamento:
       quem abrir o link antigo cai direto no painel certo.

       Não linka manifest nem registra service worker de propósito, pra
       ninguém instalar um aplicativo a partir daqui. -->

  <meta http-equiv="refresh" content="0; url=https://motora.goladies.com.br">
  <link rel="canonical" href="https://motora.goladies.com.br">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: #fffafc;
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .caixa { max-width: 380px; }
    h1 { font-size: 1.25rem; margin-bottom: 12px; }
    p { color: #6b6b6b; font-size: 0.95rem; line-height: 1.55; margin-bottom: 20px; }
    a {
      display: inline-block;
      background: #FF2D9C;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      padding: 13px 26px;
      border-radius: 10px;
    }
    a:hover { background: #e6318f; }
    a:focus-visible { outline: 3px solid #2A6FE0; outline-offset: 3px; }
  </style>
</head>
<body>
  <div class="caixa">
    <h1>O painel mudou de endereço 💗</h1>
    <p>Estamos te levando pro painel novo. Se não abrir sozinho em alguns segundos, é só tocar no botão.</p>
    <a href="https://motora.goladies.com.br">Abrir o painel da motorista</a>
  </div>

  <script>
    // location.replace em vez de href: não deixa o link antigo no histórico,
    // então o botão "voltar" não traz a motorista de volta pra cá.
    location.replace("https://motora.goladies.com.br");
  </script>
</body>
</html>
